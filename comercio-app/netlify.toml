# Sitio estático: no hay build. Se publica la carpeta de esta app tal cual.
[build]
  publish = "."

# El service worker nunca debe quedar cacheado por el navegador/CDN,
# para que las actualizaciones se detecten en cada visita.
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
